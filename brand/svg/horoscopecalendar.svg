<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="horoscopecalendar-l-tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCEBFF"/><stop offset="1" stop-color="#9FBEEE"/></linearGradient>
    <radialGradient id="horoscopecalendar-l-tileGlow" cx="0.25" cy="0.1" r="0.9"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="horoscopecalendar-l-sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity=".04"/></linearGradient>
    <linearGradient id="horoscopecalendar-l-card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".86"/><stop offset=".55" stop-color="#fff" stop-opacity=".66"/><stop offset="1" stop-color="#fff" stop-opacity=".58"/></linearGradient>
    <linearGradient id="horoscopecalendar-l-edgeTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="horoscopecalendar-l-edgeBottom" x1="0" y1="0" x2="0" y2="1"><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/></linearGradient>
    <radialGradient id="horoscopecalendar-l-tileBottom" cx="0.5" cy="1.05" r="0.75"><stop offset="0" stop-color="#DCEBFF" stop-opacity=".55"/><stop offset="1" stop-color="#DCEBFF" stop-opacity="0"/></radialGradient>
    <filter id="horoscopecalendar-l-specBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <linearGradient id="horoscopecalendar-l-head" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4C7BC2" stop-opacity=".82"/><stop offset="1" stop-color="#4C7BC2" stop-opacity=".95"/></linearGradient>
    <linearGradient id="horoscopecalendar-l-ring" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#E6ECF5"/></linearGradient>
    <linearGradient id="horoscopecalendar-l-cloudFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E3ECF7"/></linearGradient>
    <linearGradient id="horoscopecalendar-l-sunFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFDD7A"/><stop offset="1" stop-color="#FFA648"/></linearGradient>
    <linearGradient id="horoscopecalendar-l-goldFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE08A"/><stop offset="1" stop-color="#E8A317"/></linearGradient>
    <linearGradient id="horoscopecalendar-l-boltFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE48A"/><stop offset="1" stop-color="#FFB85C"/></linearGradient>
    <linearGradient id="horoscopecalendar-l-petalFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFF1B3"/></linearGradient>
    <radialGradient id="horoscopecalendar-l-pollenCore" cx="0.4" cy="0.35" r="0.8"><stop offset="0" stop-color="#FFE15C"/><stop offset="1" stop-color="#F59E0B"/></radialGradient>
    <linearGradient id="horoscopecalendar-l-moonFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFBEA"/><stop offset="1" stop-color="#FFE9A8"/></linearGradient>
    <linearGradient id="horoscopecalendar-l-plusFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4FA3FF"/><stop offset=".5" stop-color="#7C6CF5"/><stop offset="1" stop-color="#3DD6C1"/></linearGradient>
    <clipPath id="horoscopecalendar-l-tileClip"><rect width="1024" height="1024" rx="228"/></clipPath>
    <clipPath id="horoscopecalendar-l-cardClip"><rect x="140" y="190" width="744" height="680" rx="72"/></clipPath>
    <filter id="horoscopecalendar-l-softShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4C7BC2" flood-opacity=".35"/></filter>
    <filter id="horoscopecalendar-l-cardShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#4C7BC2" flood-opacity=".45"/></filter>
    <filter id="horoscopecalendar-l-sunGlow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#FFB300" flood-opacity=".55"/></filter>
  </defs>
  <!-- tile -->
  <rect width="1024" height="1024" rx="228" fill="url(#horoscopecalendar-l-tile)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#horoscopecalendar-l-tileGlow)"/>
  <path d="M0 0 H1024 V300 C 700 420, 320 380, 0 560 Z" fill="url(#horoscopecalendar-l-sheen)" clip-path="url(#horoscopecalendar-l-tileClip)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#horoscopecalendar-l-tileBottom)"/>
  <rect x="3" y="3" width="1018" height="1018" rx="226" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="6"/>
  <!-- calendar card -->
  <g filter="url(#horoscopecalendar-l-cardShadow)"><rect x="140" y="190" width="744" height="680" rx="72" fill="url(#horoscopecalendar-l-card)"/></g>
  <g clip-path="url(#horoscopecalendar-l-cardClip)"><rect x="140" y="190" width="744" height="212" fill="url(#horoscopecalendar-l-head)"/></g>
  <g clip-path="url(#horoscopecalendar-l-cardClip)">
    <ellipse cx="330" cy="505" rx="210" ry="48" fill="#fff" opacity="0.5" filter="url(#horoscopecalendar-l-specBlur)"/>
    <ellipse cx="760" cy="830" rx="170" ry="55" fill="#DCEBFF" opacity=".35" filter="url(#horoscopecalendar-l-specBlur)"/>
  </g>
  <rect x="140" y="190" width="744" height="680" rx="72" fill="none" stroke="url(#horoscopecalendar-l-edgeTop)" stroke-width="7"/>
  <rect x="140" y="190" width="744" height="680" rx="72" fill="none" stroke="url(#horoscopecalendar-l-edgeBottom)" stroke-width="5"/>
  <rect x="140" y="190" width="744" height="680" rx="72" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="3"/>
  
    <g stroke="#4C7BC2" stroke-opacity=".14" stroke-width="4" stroke-linecap="round">
      <line x1="196" y1="470" x2="828" y2="470"/><line x1="196" y1="600" x2="828" y2="600"/><line x1="196" y1="730" x2="828" y2="730"/>
      <line x1="354" y1="380" x2="354" y2="830"/><line x1="512" y1="380" x2="512" y2="830"/><line x1="670" y1="380" x2="670" y2="830"/>
    </g>
  <!-- rings -->
  <g filter="url(#horoscopecalendar-l-softShadow)">
    <rect x="268" y="130" width="64" height="150" rx="32" fill="url(#horoscopecalendar-l-ring)"/>
    <rect x="692" y="130" width="64" height="150" rx="32" fill="url(#horoscopecalendar-l-ring)"/>
  </g>
  <!-- motif -->
  <mask id="horoscopecalendar-l-moonMask"><rect width="1024" height="1024" fill="#fff"/><circle cx="581.75" cy="579.5" r="159.1" fill="#000"/></mask>
  <g filter="url(#horoscopecalendar-l-softShadow)"><g mask="url(#horoscopecalendar-l-moonMask)"><circle cx="480" cy="635" r="185" fill="url(#horoscopecalendar-l-moonFill)" stroke="#5B4BC9" stroke-opacity=".35" stroke-width="4"/></g></g><g filter="url(#horoscopecalendar-l-sunGlow)"><polygon points="735.0,438.0 753.4,481.6 797.0,500.0 753.4,518.4 735.0,562.0 716.6,518.4 673.0,500.0 716.6,481.6" fill="#FFF3C4"  stroke-linejoin="round"/><polygon points="680.0,376.0 690.1,399.9 714.0,410.0 690.1,420.1 680.0,444.0 669.9,420.1 646.0,410.0 669.9,399.9" fill="#FFF3C4"  stroke-linejoin="round"/><polygon points="790.0,612.0 798.3,631.7 818.0,640.0 798.3,648.3 790.0,668.0 781.7,648.3 762.0,640.0 781.7,631.7" fill="#FFF3C4"  stroke-linejoin="round"/></g>
</svg>