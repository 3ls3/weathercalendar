<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="horoscopeprocalendar-s-tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCEBFF"/><stop offset="1" stop-color="#9FBEEE"/></linearGradient>
    <radialGradient id="horoscopeprocalendar-s-tileGlow" cx="0.25" cy="0.1" r="0.9"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="horoscopeprocalendar-s-sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity=".04"/></linearGradient>
    <linearGradient id="horoscopeprocalendar-s-card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".86"/><stop offset=".55" stop-color="#fff" stop-opacity=".66"/><stop offset="1" stop-color="#fff" stop-opacity=".58"/></linearGradient>
    <linearGradient id="horoscopeprocalendar-s-edgeTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="horoscopeprocalendar-s-edgeBottom" x1="0" y1="0" x2="0" y2="1"><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/></linearGradient>
    <radialGradient id="horoscopeprocalendar-s-tileBottom" cx="0.5" cy="1.05" r="0.75"><stop offset="0" stop-color="#DCEBFF" stop-opacity=".55"/><stop offset="1" stop-color="#DCEBFF" stop-opacity="0"/></radialGradient>
    <filter id="horoscopeprocalendar-s-specBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <linearGradient id="horoscopeprocalendar-s-head" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4C7BC2" stop-opacity=".82"/><stop offset="1" stop-color="#4C7BC2" stop-opacity=".95"/></linearGradient>
    <linearGradient id="horoscopeprocalendar-s-ring" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#E6ECF5"/></linearGradient>
    <linearGradient id="horoscopeprocalendar-s-cloudFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E3ECF7"/></linearGradient>
    <linearGradient id="horoscopeprocalendar-s-sunFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFDD7A"/><stop offset="1" stop-color="#FFA648"/></linearGradient>
    <linearGradient id="horoscopeprocalendar-s-goldFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE08A"/><stop offset="1" stop-color="#E8A317"/></linearGradient>
    <linearGradient id="horoscopeprocalendar-s-boltFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE48A"/><stop offset="1" stop-color="#FFB85C"/></linearGradient>
    <linearGradient id="horoscopeprocalendar-s-petalFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFF1B3"/></linearGradient>
    <radialGradient id="horoscopeprocalendar-s-pollenCore" cx="0.4" cy="0.35" r="0.8"><stop offset="0" stop-color="#FFE15C"/><stop offset="1" stop-color="#F59E0B"/></radialGradient>
    <linearGradient id="horoscopeprocalendar-s-moonFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFBEA"/><stop offset="1" stop-color="#FFE9A8"/></linearGradient>
    <linearGradient id="horoscopeprocalendar-s-plusFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4FA3FF"/><stop offset=".5" stop-color="#7C6CF5"/><stop offset="1" stop-color="#3DD6C1"/></linearGradient>
    <clipPath id="horoscopeprocalendar-s-tileClip"><rect width="1024" height="1024" rx="228"/></clipPath>
    <clipPath id="horoscopeprocalendar-s-cardClip"><rect x="140" y="180" width="744" height="690" rx="72"/></clipPath>
    <filter id="horoscopeprocalendar-s-softShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#4C7BC2" flood-opacity=".35"/></filter>
    <filter id="horoscopeprocalendar-s-cardShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#4C7BC2" flood-opacity=".45"/></filter>
    <filter id="horoscopeprocalendar-s-sunGlow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#FFB300" flood-opacity=".55"/></filter>
  </defs>
  <!-- tile -->
  <rect width="1024" height="1024" rx="228" fill="url(#horoscopeprocalendar-s-tile)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#horoscopeprocalendar-s-tileGlow)"/>
  
  <rect width="1024" height="1024" rx="228" fill="url(#horoscopeprocalendar-s-tileBottom)"/>
  <rect x="3" y="3" width="1018" height="1018" rx="226" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="6"/>
  <!-- calendar card -->
  <g filter="url(#horoscopeprocalendar-s-cardShadow)"><rect x="140" y="180" width="744" height="690" rx="72" fill="url(#horoscopeprocalendar-s-card)"/></g>
  <g clip-path="url(#horoscopeprocalendar-s-cardClip)"><rect x="140" y="180" width="744" height="222" fill="url(#horoscopeprocalendar-s-head)"/></g>
  <g clip-path="url(#horoscopeprocalendar-s-cardClip)">
    <ellipse cx="330" cy="505" rx="230" ry="55" fill="#fff" opacity="0.45" filter="url(#horoscopeprocalendar-s-specBlur)"/>
    <ellipse cx="760" cy="830" rx="200" ry="70" fill="#DCEBFF" opacity=".35" filter="url(#horoscopeprocalendar-s-specBlur)"/>
  </g>
  <rect x="140" y="180" width="744" height="690" rx="72" fill="none" stroke="url(#horoscopeprocalendar-s-edgeTop)" stroke-width="10"/>
  <rect x="140" y="180" width="744" height="690" rx="72" fill="none" stroke="url(#horoscopeprocalendar-s-edgeBottom)" stroke-width="8"/>
  <rect x="140" y="180" width="744" height="690" rx="72" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="3"/>
  
  <!-- rings -->
  <g filter="url(#horoscopeprocalendar-s-softShadow)">
    <rect x="262" y="120" width="76" height="170" rx="38" fill="url(#horoscopeprocalendar-s-ring)"/>
    <rect x="686" y="120" width="76" height="170" rx="38" fill="url(#horoscopeprocalendar-s-ring)"/>
  </g>
  <!-- motif -->
  <g filter="url(#horoscopeprocalendar-s-sunGlow)"><line x1="785.8" y1="550.0" x2="862.8" y2="550.0" stroke="url(#horoscopeprocalendar-s-goldFill)" stroke-width="42" stroke-linecap="round"/><line x1="735.8" y1="670.8" x2="790.2" y2="725.2" stroke="url(#horoscopeprocalendar-s-goldFill)" stroke-width="42" stroke-linecap="round"/><line x1="615.0" y1="720.8" x2="615.0" y2="797.8" stroke="url(#horoscopeprocalendar-s-goldFill)" stroke-width="42" stroke-linecap="round"/><line x1="494.2" y1="670.8" x2="439.8" y2="725.2" stroke="url(#horoscopeprocalendar-s-goldFill)" stroke-width="42" stroke-linecap="round"/><line x1="444.2" y1="550.0" x2="367.2" y2="550.0" stroke="url(#horoscopeprocalendar-s-goldFill)" stroke-width="42" stroke-linecap="round"/><line x1="494.2" y1="429.2" x2="439.8" y2="374.8" stroke="url(#horoscopeprocalendar-s-goldFill)" stroke-width="42" stroke-linecap="round"/><line x1="615.0" y1="379.2" x2="615.0" y2="302.2" stroke="url(#horoscopeprocalendar-s-goldFill)" stroke-width="42" stroke-linecap="round"/><line x1="735.8" y1="429.2" x2="790.2" y2="374.8" stroke="url(#horoscopeprocalendar-s-goldFill)" stroke-width="42" stroke-linecap="round"/><circle cx="615" cy="550" r="140" fill="url(#horoscopeprocalendar-s-goldFill)"/>
    <circle cx="573" cy="508" r="63" fill="#fff" opacity=".35"/></g><mask id="horoscopeprocalendar-s-moonMask"><rect width="1024" height="1024" fill="#fff"/><circle cx="542.75" cy="598.5" r="176.3" fill="#000"/></mask>
  <g filter="url(#horoscopeprocalendar-s-softShadow)"><g mask="url(#horoscopeprocalendar-s-moonMask)"><circle cx="430" cy="660" r="205" fill="url(#horoscopeprocalendar-s-moonFill)" stroke="#2A1C7E" stroke-opacity=".35" stroke-width="8"/></g></g>
</svg>