    <ellipse cx="760" cy="830" rx="170" ry="55" fill="#DCEBFF" opacity=".35" filter="url(#horoscopeprocalendar-l-specBlur)"/>
  </g>
  <rect x="140" y="190" width="744" height="680" rx="72" fill="none" stroke="url(#horoscopeprocalendar-l-edgeTop)" stroke-width="7"/>
  <rect x="140" y="190" width="744" height="680" rx="72" fill="none" stroke="url(#horoscopeprocalendar-l-edgeBottom)" stroke-width="5"/>
  <rect x="140" y="190" width="744" height="680" rx="72" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="3"/>
  
    <g stroke="#4C7BC2" stroke-opacity=".14" stroke-width="4" stroke-linecap="round">
      <line x1="196" y1="470" x2="828" y2="470"/><line x1="196" y1="600" x2="828" y2="600"/><line x1="196" y1="730" x2="828" y2="730"/>
      <line x1="354" y1="380" x2="354" y2="830"/><line x1="512" y1="380" x2="512" y2="830"/><line x1="670" y1="380" x2="670" y2="830"/>
    </g>
  <!-- rings -->
  <g filter="url(#horoscopeprocalendar-l-softShadow)">
    <rect x="268" y="130" width="64" height="150" rx="32" fill="url(#horoscopeprocalendar-l-ring)"/>
    <rect x="692" y="130" width="64" height="150" rx="32" fill="url(#horoscopeprocalendar-l-ring)"/>
  </g>
  <!-- motif -->
  <g filter="url(#horoscopeprocalendar-l-sunGlow)"><line x1="734.2" y1="560.0" x2="794.7" y2="560.0" stroke="url(#horoscopeprocalendar-l-goldFill)" stroke-width="24.2" stroke-linecap="round"/><line x1="694.9" y1="654.9" x2="737.7" y2="697.7" stroke="url(#horoscopeprocalendar-l-goldFill)" stroke-width="24.2" stroke-linecap="round"/><line x1="600.0" y1="694.2" x2="600.0" y2="754.7" stroke="url(#horoscopeprocalendar-l-goldFill)" stroke-width="24.2" stroke-linecap="round"/><line x1="505.1" y1="654.9" x2="462.3" y2="697.7" stroke="url(#horoscopeprocalendar-l-goldFill)" stroke-width="24.2" stroke-linecap="round"/><line x1="465.8" y1="560.0" x2="405.3" y2="560.0" stroke="url(#horoscopeprocalendar-l-goldFill)" stroke-width="24.2" stroke-linecap="round"/><line x1="505.1" y1="465.1" x2="462.3" y2="422.3" stroke="url(#horoscopeprocalendar-l-goldFill)" stroke-width="24.2" stroke-linecap="round"/><line x1="600.0" y1="425.8" x2="600.0" y2="365.3" stroke="url(#horoscopeprocalendar-l-goldFill)" stroke-width="24.2" stroke-linecap="round"/><line x1="694.9" y1="465.1" x2="737.7" y2="422.3" stroke="url(#horoscopeprocalendar-l-goldFill)" stroke-width="24.2" stroke-linecap="round"/><circle cx="600" cy="560" r="110" fill="url(#horoscopeprocalendar-l-goldFill)"/>
    <circle cx="567" cy="527" r="49.5" fill="#fff" opacity=".35"/></g><mask id="horoscopeprocalendar-l-moonMask"><rect width="1024" height="1024" fill="#fff"/><circle cx="543.5" cy="594" r="146.2" fill="#000"/></mask>
  <g filter="url(#horoscopeprocalendar-l-softShadow)"><g mask="url(#horoscopeprocalendar-l-moonMask)"><circle cx="450" cy="645" r="170" fill="url(#horoscopeprocalendar-l-moonFill)" stroke="#2A1C7E" stroke-opacity=".35" stroke-width="4"/></g></g><g filter="url(#horoscopeprocalendar-l-sunGlow)"><polygon points="270.0,440.0 278.9,461.1 300.0,470.0 278.9,478.9 270.0,500.0 261.1,478.9 240.0,470.0 261.1,461.1" fill="#FFD86B"  stroke-linejoin="round"/></g>
