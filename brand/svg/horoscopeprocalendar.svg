  <g clip-path="url(#horoscopeprocalendar-l-cardClip)"><rect x="140" y="190" width="744" height="212" fill="url(#horoscopeprocalendar-l-head)"/></g>
  <g clip-path="url(#horoscopeprocalendar-l-cardClip)">
