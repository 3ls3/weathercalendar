    <filter id="horoscopeprocalendar-l-softShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4C7BC2" flood-opacity=".35"/></filter>
    <filter id="horoscopeprocalendar-l-cardShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#4C7BC2" flood-opacity=".45"/></filter>
    <filter id="horoscopeprocalendar-l-sunGlow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#FFB300" flood-opacity=".55"/></filter>
