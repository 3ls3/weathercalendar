<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="plannercalendar-l-tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCEBFF"/><stop offset="1" stop-color="#9FBEEE"/></linearGradient>
    <radialGradient id="plannercalendar-l-tileGlow" cx="0.25" cy="0.1" r="0.9"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="plannercalendar-l-sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity=".04"/></linearGradient>
    <linearGradient id="plannercalendar-l-card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".86"/><stop offset=".55" stop-color="#fff" stop-opacity=".66"/><stop offset="1" stop-color="#fff" stop-opacity=".58"/></linearGradient>
    <linearGradient id="plannercalendar-l-edgeTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="plannercalendar-l-edgeBottom" x1="0" y1="0" x2="0" y2="1"><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/></linearGradient>
    <radialGradient id="plannercalendar-l-tileBottom" cx="0.5" cy="1.05" r="0.75"><stop offset="0" stop-color="#DCEBFF" stop-opacity=".55"/><stop offset="1" stop-color="#DCEBFF" stop-opacity="0"/></radialGradient>
    <filter id="plannercalendar-l-specBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <linearGradient id="plannercalendar-l-head" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4C7BC2" stop-opacity=".82"/><stop offset="1" stop-color="#4C7BC2" stop-opacity=".95"/></linearGradient>
    <linearGradient id="plannercalendar-l-ring" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#E6ECF5"/></linearGradient>
    <linearGradient id="plannercalendar-l-cloudFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E3ECF7"/></linearGradient>
    <linearGradient id="plannercalendar-l-sunFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFDD7A"/><stop offset="1" stop-color="#FFA648"/></linearGradient>
    <linearGradient id="plannercalendar-l-goldFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE08A"/><stop offset="1" stop-color="#E8A317"/></linearGradient>
    <linearGradient id="plannercalendar-l-boltFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE48A"/><stop offset="1" stop-color="#FFB85C"/></linearGradient>
    <linearGradient id="plannercalendar-l-petalFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFF1B3"/></linearGradient>
    <radialGradient id="plannercalendar-l-pollenCore" cx="0.4" cy="0.35" r="0.8"><stop offset="0" stop-color="#FFE15C"/><stop offset="1" stop-color="#F59E0B"/></radialGradient>
    <linearGradient id="plannercalendar-l-moonFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFBEA"/><stop offset="1" stop-color="#FFE9A8"/></linearGradient>
    <linearGradient id="plannercalendar-l-plusFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4FA3FF"/><stop offset=".5" stop-color="#7C6CF5"/><stop offset="1" stop-color="#3DD6C1"/></linearGradient>
    <clipPath id="plannercalendar-l-tileClip"><rect width="1024" height="1024" rx="228"/></clipPath>
    <clipPath id="plannercalendar-l-cardClip"><rect x="140" y="190" width="744" height="680" rx="72"/></clipPath>
    <filter id="plannercalendar-l-softShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4C7BC2" flood-opacity=".35"/></filter>
    <filter id="plannercalendar-l-cardShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#4C7BC2" flood-opacity=".45"/></filter>
    <filter id="plannercalendar-l-sunGlow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#FFB300" flood-opacity=".55"/></filter>
  </defs>
  <!-- tile -->
  <rect width="1024" height="1024" rx="228" fill="url(#plannercalendar-l-tile)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#plannercalendar-l-tileGlow)"/>
  <path d="M0 0 H1024 V300 C 700 420, 320 380, 0 560 Z" fill="url(#plannercalendar-l-sheen)" clip-path="url(#plannercalendar-l-tileClip)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#plannercalendar-l-tileBottom)"/>
  <rect x="3" y="3" width="1018" height="1018" rx="226" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="6"/>
  <!-- calendar card -->
  <g filter="url(#plannercalendar-l-cardShadow)"><rect x="140" y="190" width="744" height="680" rx="72" fill="url(#plannercalendar-l-card)"/></g>
  <g clip-path="url(#plannercalendar-l-cardClip)"><rect x="140" y="190" width="744" height="212" fill="url(#plannercalendar-l-head)"/></g>
  <g clip-path="url(#plannercalendar-l-cardClip)">
    <ellipse cx="330" cy="505" rx="210" ry="48" fill="#fff" opacity="0.5" filter="url(#plannercalendar-l-specBlur)"/>
    <ellipse cx="760" cy="830" rx="170" ry="55" fill="#DCEBFF" opacity=".35" filter="url(#plannercalendar-l-specBlur)"/>
  </g>
  <rect x="140" y="190" width="744" height="680" rx="72" fill="none" stroke="url(#plannercalendar-l-edgeTop)" stroke-width="7"/>
  <rect x="140" y="190" width="744" height="680" rx="72" fill="none" stroke="url(#plannercalendar-l-edgeBottom)" stroke-width="5"/>
  <rect x="140" y="190" width="744" height="680" rx="72" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="3"/>
  
    <g stroke="#4C7BC2" stroke-opacity=".14" stroke-width="4" stroke-linecap="round">
      <line x1="196" y1="470" x2="828" y2="470"/><line x1="196" y1="600" x2="828" y2="600"/><line x1="196" y1="730" x2="828" y2="730"/>
      <line x1="354" y1="380" x2="354" y2="830"/><line x1="512" y1="380" x2="512" y2="830"/><line x1="670" y1="380" x2="670" y2="830"/>
    </g>
  <!-- rings -->
  <g filter="url(#plannercalendar-l-softShadow)">
    <rect x="268" y="130" width="64" height="150" rx="32" fill="url(#plannercalendar-l-ring)"/>
    <rect x="692" y="130" width="64" height="150" rx="32" fill="url(#plannercalendar-l-ring)"/>
  </g>
  <!-- motif -->
  <g filter="url(#plannercalendar-l-softShadow)"><rect x="350" y="480" width="260" height="86" rx="28" fill="#FF8E85"/>
      <rect x="350" y="480" width="260" height="43" rx="28" fill="#fff" opacity=".22"/><rect x="350" y="596" width="330" height="86" rx="28" fill="#FFCF6E"/>
      <rect x="350" y="596" width="330" height="43" rx="28" fill="#fff" opacity=".22"/><rect x="350" y="712" width="210" height="86" rx="28" fill="#9A8DF4"/>
      <rect x="350" y="712" width="210" height="43" rx="28" fill="#fff" opacity=".22"/></g><g filter="url(#plannercalendar-l-sunGlow)"><polygon points="720.0,426.0 739.0,471.0 784.0,490.0 739.0,509.0 720.0,554.0 701.0,509.0 656.0,490.0 701.0,471.0" fill="#FFFFFF" stroke="#0F8C9A" stroke-opacity=".35" stroke-width="3" stroke-linejoin="round"/><polygon points="770.0,564.0 777.7,582.3 796.0,590.0 777.7,597.7 770.0,616.0 762.3,597.7 744.0,590.0 762.3,582.3" fill="#FFFFFF"  stroke-linejoin="round"/></g>
</svg>