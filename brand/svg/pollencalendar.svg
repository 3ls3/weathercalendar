<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="pollencalendar-l-tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCEBFF"/><stop offset="1" stop-color="#9FBEEE"/></linearGradient>
    <radialGradient id="pollencalendar-l-tileGlow" cx="0.25" cy="0.1" r="0.9"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="pollencalendar-l-sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity=".04"/></linearGradient>
    <linearGradient id="pollencalendar-l-card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".86"/><stop offset=".55" stop-color="#fff" stop-opacity=".66"/><stop offset="1" stop-color="#fff" stop-opacity=".58"/></linearGradient>
    <linearGradient id="pollencalendar-l-edgeTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="pollencalendar-l-edgeBottom" x1="0" y1="0" x2="0" y2="1"><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/></linearGradient>
    <radialGradient id="pollencalendar-l-tileBottom" cx="0.5" cy="1.05" r="0.75"><stop offset="0" stop-color="#DCEBFF" stop-opacity=".55"/><stop offset="1" stop-color="#DCEBFF" stop-opacity="0"/></radialGradient>
    <filter id="pollencalendar-l-specBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <linearGradient id="pollencalendar-l-head" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4C7BC2" stop-opacity=".82"/><stop offset="1" stop-color="#4C7BC2" stop-opacity=".95"/></linearGradient>
    <linearGradient id="pollencalendar-l-ring" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#E6ECF5"/></linearGradient>
    <linearGradient id="pollencalendar-l-cloudFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E3ECF7"/></linearGradient>
    <linearGradient id="pollencalendar-l-sunFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFDD7A"/><stop offset="1" stop-color="#FFA648"/></linearGradient>
    <linearGradient id="pollencalendar-l-goldFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE08A"/><stop offset="1" stop-color="#E8A317"/></linearGradient>
    <linearGradient id="pollencalendar-l-boltFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE48A"/><stop offset="1" stop-color="#FFB85C"/></linearGradient>
    <linearGradient id="pollencalendar-l-petalFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFF1B3"/></linearGradient>
    <radialGradient id="pollencalendar-l-pollenCore" cx="0.4" cy="0.35" r="0.8"><stop offset="0" stop-color="#FFE15C"/><stop offset="1" stop-color="#F59E0B"/></radialGradient>
    <linearGradient id="pollencalendar-l-moonFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFBEA"/><stop offset="1" stop-color="#FFE9A8"/></linearGradient>
    <linearGradient id="pollencalendar-l-plusFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4FA3FF"/><stop offset=".5" stop-color="#7C6CF5"/><stop offset="1" stop-color="#3DD6C1"/></linearGradient>
    <clipPath id="pollencalendar-l-tileClip"><rect width="1024" height="1024" rx="228"/></clipPath>
    <clipPath id="pollencalendar-l-cardClip"><rect x="140" y="190" width="744" height="680" rx="72"/></clipPath>
    <filter id="pollencalendar-l-softShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4C7BC2" flood-opacity=".35"/></filter>
    <filter id="pollencalendar-l-cardShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#4C7BC2" flood-opacity=".45"/></filter>
    <filter id="pollencalendar-l-sunGlow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#FFB300" flood-opacity=".55"/></filter>
  </defs>
  <!-- tile -->
  <rect width="1024" height="1024" rx="228" fill="url(#pollencalendar-l-tile)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#pollencalendar-l-tileGlow)"/>
  <path d="M0 0 H1024 V300 C 700 420, 320 380, 0 560 Z" fill="url(#pollencalendar-l-sheen)" clip-path="url(#pollencalendar-l-tileClip)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#pollencalendar-l-tileBottom)"/>
  <rect x="3" y="3" width="1018" height="1018" rx="226" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="6"/>
  <!-- calendar card -->
  <g filter="url(#pollencalendar-l-cardShadow)"><rect x="140" y="190" width="744" height="680" rx="72" fill="url(#pollencalendar-l-card)"/></g>
  <g clip-path="url(#pollencalendar-l-cardClip)"><rect x="140" y="190" width="744" height="212" fill="url(#pollencalendar-l-head)"/></g>
  <g clip-path="url(#pollencalendar-l-cardClip)">
    <ellipse cx="330" cy="505" rx="210" ry="48" fill="#fff" opacity="0.5" filter="url(#pollencalendar-l-specBlur)"/>
    <ellipse cx="760" cy="830" rx="170" ry="55" fill="#DCEBFF" opacity=".35" filter="url(#pollencalendar-l-specBlur)"/>
  </g>
  <rect x="140" y="190" width="744" height="680" rx="72" fill="none" stroke="url(#pollencalendar-l-edgeTop)" stroke-width="7"/>
  <rect x="140" y="190" width="744" height="680" rx="72" fill="none" stroke="url(#pollencalendar-l-edgeBottom)" stroke-width="5"/>
  <rect x="140" y="190" width="744" height="680" rx="72" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="3"/>
  
    <g stroke="#4C7BC2" stroke-opacity=".14" stroke-width="4" stroke-linecap="round">
      <line x1="196" y1="470" x2="828" y2="470"/><line x1="196" y1="600" x2="828" y2="600"/><line x1="196" y1="730" x2="828" y2="730"/>
      <line x1="354" y1="380" x2="354" y2="830"/><line x1="512" y1="380" x2="512" y2="830"/><line x1="670" y1="380" x2="670" y2="830"/>
    </g>
  <!-- rings -->
  <g filter="url(#pollencalendar-l-softShadow)">
    <rect x="268" y="130" width="64" height="150" rx="32" fill="url(#pollencalendar-l-ring)"/>
    <rect x="692" y="130" width="64" height="150" rx="32" fill="url(#pollencalendar-l-ring)"/>
  </g>
  <!-- motif -->
  <g filter="url(#pollencalendar-l-softShadow)"><ellipse cx="512" cy="530.8" rx="82" ry="99.2" fill="url(#pollencalendar-l-petalFill)" stroke="#D9B400" stroke-opacity=".35" stroke-width="4" transform="rotate(-90 512 630)"/><ellipse cx="512" cy="530.8" rx="82" ry="99.2" fill="url(#pollencalendar-l-petalFill)" stroke="#D9B400" stroke-opacity=".35" stroke-width="4" transform="rotate(-18 512 630)"/><ellipse cx="512" cy="530.8" rx="82" ry="99.2" fill="url(#pollencalendar-l-petalFill)" stroke="#D9B400" stroke-opacity=".35" stroke-width="4" transform="rotate(54 512 630)"/><ellipse cx="512" cy="530.8" rx="82" ry="99.2" fill="url(#pollencalendar-l-petalFill)" stroke="#D9B400" stroke-opacity=".35" stroke-width="4" transform="rotate(126 512 630)"/><ellipse cx="512" cy="530.8" rx="82" ry="99.2" fill="url(#pollencalendar-l-petalFill)" stroke="#D9B400" stroke-opacity=".35" stroke-width="4" transform="rotate(198 512 630)"/><circle cx="512" cy="630" r="72" fill="url(#pollencalendar-l-pollenCore)"/><circle cx="488" cy="606" r="26" fill="#fff" opacity=".4"/></g><g filter="url(#pollencalendar-l-sunGlow)"><circle cx="760" cy="450" r="22" fill="#FFD23F"/><circle cx="700" cy="400" r="12" fill="#FFD23F"/><circle cx="290" cy="470" r="16" fill="#FFD23F"/><circle cx="330" cy="410" r="9" fill="#FFD23F"/><circle cx="800" cy="540" r="10" fill="#FFD23F"/></g>
</svg>