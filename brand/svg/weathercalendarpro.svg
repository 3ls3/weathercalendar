  <g clip-path="url(#weathercalendarpro-l-cardClip)"><rect x="140" y="190" width="744" height="212" fill="url(#weathercalendarpro-l-head)"/></g>
  <g clip-path="url(#weathercalendarpro-l-cardClip)">
