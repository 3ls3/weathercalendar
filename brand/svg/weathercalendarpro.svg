    <rect x="692" y="130" width="64" height="150" rx="32" fill="url(#weathercalendarpro-l-ring)"/>
  </g>
  <!-- motif -->
  <g filter="url(#weathercalendarpro-l-sunGlow)"><line x1="762.5" y1="505.0" x2="831.3" y2="505.0" stroke="url(#weathercalendarpro-l-sunFill)" stroke-width="27.5" stroke-linecap="round"/><line x1="717.8" y1="612.8" x2="766.4" y2="661.4" stroke="url(#weathercalendarpro-l-sunFill)" stroke-width="27.5" stroke-linecap="round"/><line x1="610.0" y1="657.5" x2="610.0" y2="726.3" stroke="url(#weathercalendarpro-l-sunFill)" stroke-width="27.5" stroke-linecap="round"/><line x1="502.2" y1="612.8" x2="453.6" y2="661.4" stroke="url(#weathercalendarpro-l-sunFill)" stroke-width="27.5" stroke-linecap="round"/><line x1="457.5" y1="505.0" x2="388.8" y2="505.0" stroke="url(#weathercalendarpro-l-sunFill)" stroke-width="27.5" stroke-linecap="round"/><line x1="502.2" y1="397.2" x2="453.6" y2="348.6" stroke="url(#weathercalendarpro-l-sunFill)" stroke-width="27.5" stroke-linecap="round"/><line x1="610.0" y1="352.5" x2="610.0" y2="283.8" stroke="url(#weathercalendarpro-l-sunFill)" stroke-width="27.5" stroke-linecap="round"/><line x1="717.8" y1="397.2" x2="766.4" y2="348.6" stroke="url(#weathercalendarpro-l-sunFill)" stroke-width="27.5" stroke-linecap="round"/><circle cx="610" cy="505" r="125" fill="url(#weathercalendarpro-l-sunFill)"/>
    <circle cx="572.5" cy="467.5" r="56.25" fill="#fff" opacity=".35"/></g><g filter="url(#weathercalendarpro-l-softShadow)">
    <path stroke="#7A9CC0" stroke-opacity=".35" stroke-width="5" fill="url(#weathercalendarpro-l-cloudFill)" d="
      M 311 728
      a 84 84 0 0 1 73.5 -136.5
      a 115.5 115.5 0 0 1 215.25 -21
      a 89.25 89.25 0 0 1 110.25 157.5
      a 63 63 0 0 1 -63 63
      H 374
      a 63 63 0 0 1 -63 -63 Z"/>
