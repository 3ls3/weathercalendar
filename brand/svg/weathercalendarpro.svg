  <rect width="1024" height="1024" rx="228" fill="url(#weathercalendarpro-l-tileGlow)"/>
  <path d="M0 0 H1024 V300 C 700 420, 320 380, 0 560 Z" fill="url(#weathercalendarpro-l-sheen)" clip-path="url(#weathercalendarpro-l-tileClip)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#weathercalendarpro-l-tileBottom)"/>
  <rect x="3" y="3" width="1018" height="1018" rx="226" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="6"/>
