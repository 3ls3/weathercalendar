<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="weathercalendarultra-l-tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCEBFF"/><stop offset="1" stop-color="#9FBEEE"/></linearGradient>
    <radialGradient id="weathercalendarultra-l-tileGlow" cx="0.25" cy="0.1" r="0.9"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="weathercalendarultra-l-sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity=".04"/></linearGradient>
    <linearGradient id="weathercalendarultra-l-card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".86"/><stop offset=".55" stop-color="#fff" stop-opacity=".66"/><stop offset="1" stop-color="#fff" stop-opacity=".58"/></linearGradient>
    <linearGradient id="weathercalendarultra-l-edgeTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="weathercalendarultra-l-edgeBottom" x1="0" y1="0" x2="0" y2="1"><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/></linearGradient>
    <radialGradient id="weathercalendarultra-l-tileBottom" cx="0.5" cy="1.05" r="0.75"><stop offset="0" stop-color="#DCEBFF" stop-opacity=".55"/><stop offset="1" stop-color="#DCEBFF" stop-opacity="0"/></radialGradient>
    <filter id="weathercalendarultra-l-specBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <linearGradient id="weathercalendarultra-l-head" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4C7BC2" stop-opacity=".82"/><stop offset="1" stop-color="#4C7BC2" stop-opacity=".95"/></linearGradient>
    <linearGradient id="weathercalendarultra-l-ring" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#E6ECF5"/></linearGradient>
    <linearGradient id="weathercalendarultra-l-cloudFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E3ECF7"/></linearGradient>
    <linearGradient id="weathercalendarultra-l-sunFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFDD7A"/><stop offset="1" stop-color="#FFA648"/></linearGradient>
    <linearGradient id="weathercalendarultra-l-goldFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE08A"/><stop offset="1" stop-color="#E8A317"/></linearGradient>
    <linearGradient id="weathercalendarultra-l-boltFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE48A"/><stop offset="1" stop-color="#FFB85C"/></linearGradient>
    <linearGradient id="weathercalendarultra-l-petalFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFF1B3"/></linearGradient>
    <radialGradient id="weathercalendarultra-l-pollenCore" cx="0.4" cy="0.35" r="0.8"><stop offset="0" stop-color="#FFE15C"/><stop offset="1" stop-color="#F59E0B"/></radialGradient>
    <linearGradient id="weathercalendarultra-l-moonFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFBEA"/><stop offset="1" stop-color="#FFE9A8"/></linearGradient>
    <linearGradient id="weathercalendarultra-l-plusFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4FA3FF"/><stop offset=".5" stop-color="#7C6CF5"/><stop offset="1" stop-color="#3DD6C1"/></linearGradient>
    <clipPath id="weathercalendarultra-l-tileClip"><rect width="1024" height="1024" rx="228"/></clipPath>
    <clipPath id="weathercalendarultra-l-cardClip"><rect x="140" y="190" width="744" height="680" rx="72"/></clipPath>
    <filter id="weathercalendarultra-l-softShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4C7BC2" flood-opacity=".35"/></filter>
    <filter id="weathercalendarultra-l-cardShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#4C7BC2" flood-opacity=".45"/></filter>
    <filter id="weathercalendarultra-l-sunGlow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#FFB300" flood-opacity=".55"/></filter>
  </defs>
  <!-- tile -->
  <rect width="1024" height="1024" rx="228" fill="url(#weathercalendarultra-l-tile)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#weathercalendarultra-l-tileGlow)"/>
  <path d="M0 0 H1024 V300 C 700 420, 320 380, 0 560 Z" fill="url(#weathercalendarultra-l-sheen)" clip-path="url(#weathercalendarultra-l-tileClip)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#weathercalendarultra-l-tileBottom)"/>
  <rect x="3" y="3" width="1018" height="1018" rx="226" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="6"/>
  <!-- calendar card -->
  <g filter="url(#weathercalendarultra-l-cardShadow)"><rect x="140" y="190" width="744" height="680" rx="72" fill="url(#weathercalendarultra-l-card)"/></g>
  <g clip-path="url(#weathercalendarultra-l-cardClip)"><rect x="140" y="190" width="744" height="212" fill="url(#weathercalendarultra-l-head)"/></g>
  <g clip-path="url(#weathercalendarultra-l-cardClip)">
    <ellipse cx="330" cy="505" rx="210" ry="48" fill="#fff" opacity="0.5" filter="url(#weathercalendarultra-l-specBlur)"/>
    <ellipse cx="760" cy="830" rx="170" ry="55" fill="#DCEBFF" opacity=".35" filter="url(#weathercalendarultra-l-specBlur)"/>
  </g>
  <rect x="140" y="190" width="744" height="680" rx="72" fill="none" stroke="url(#weathercalendarultra-l-edgeTop)" stroke-width="7"/>
  <rect x="140" y="190" width="744" height="680" rx="72" fill="none" stroke="url(#weathercalendarultra-l-edgeBottom)" stroke-width="5"/>
  <rect x="140" y="190" width="744" height="680" rx="72" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="3"/>
  
    <g stroke="#4C7BC2" stroke-opacity=".14" stroke-width="4" stroke-linecap="round">
      <line x1="196" y1="470" x2="828" y2="470"/><line x1="196" y1="600" x2="828" y2="600"/><line x1="196" y1="730" x2="828" y2="730"/>
      <line x1="354" y1="380" x2="354" y2="830"/><line x1="512" y1="380" x2="512" y2="830"/><line x1="670" y1="380" x2="670" y2="830"/>
    </g>
  <!-- rings -->
  <g filter="url(#weathercalendarultra-l-softShadow)">
    <rect x="268" y="130" width="64" height="150" rx="32" fill="url(#weathercalendarultra-l-ring)"/>
    <rect x="692" y="130" width="64" height="150" rx="32" fill="url(#weathercalendarultra-l-ring)"/>
  </g>
  <!-- motif -->
  <g filter="url(#weathercalendarultra-l-sunGlow)"><line x1="756.4" y1="500.0" x2="822.4" y2="500.0" stroke="url(#weathercalendarultra-l-sunFill)" stroke-width="26.4" stroke-linecap="round"/><line x1="713.5" y1="603.5" x2="760.2" y2="650.2" stroke="url(#weathercalendarultra-l-sunFill)" stroke-width="26.4" stroke-linecap="round"/><line x1="610.0" y1="646.4" x2="610.0" y2="712.4" stroke="url(#weathercalendarultra-l-sunFill)" stroke-width="26.4" stroke-linecap="round"/><line x1="506.5" y1="603.5" x2="459.8" y2="650.2" stroke="url(#weathercalendarultra-l-sunFill)" stroke-width="26.4" stroke-linecap="round"/><line x1="463.6" y1="500.0" x2="397.6" y2="500.0" stroke="url(#weathercalendarultra-l-sunFill)" stroke-width="26.4" stroke-linecap="round"/><line x1="506.5" y1="396.5" x2="459.8" y2="349.8" stroke="url(#weathercalendarultra-l-sunFill)" stroke-width="26.4" stroke-linecap="round"/><line x1="610.0" y1="353.6" x2="610.0" y2="287.6" stroke="url(#weathercalendarultra-l-sunFill)" stroke-width="26.4" stroke-linecap="round"/><line x1="713.5" y1="396.5" x2="760.2" y2="349.8" stroke="url(#weathercalendarultra-l-sunFill)" stroke-width="26.4" stroke-linecap="round"/><circle cx="610" cy="500" r="120" fill="url(#weathercalendarultra-l-sunFill)"/>
    <circle cx="574" cy="464" r="54" fill="#fff" opacity=".35"/></g><g filter="url(#weathercalendarultra-l-softShadow)">
    <path stroke="#7A9CC0" stroke-opacity=".35" stroke-width="5" fill="url(#weathercalendarultra-l-cloudFill)" d="
      M 320 700
      a 80 80 0 0 1 70 -130
      a 110 110 0 0 1 205 -20
      a 85 85 0 0 1 105 150
      a 60 60 0 0 1 -60 60
      H 380
      a 60 60 0 0 1 -60 -60 Z"/>
  </g>
    <g filter="url(#weathercalendarultra-l-softShadow)"><polygon points="560,710 505,820 550,812 520,905 625,765 572,775 600,710" fill="url(#weathercalendarultra-l-boltFill)" stroke="#B8600A" stroke-opacity=".5" stroke-width="4" stroke-linejoin="round"/></g>
